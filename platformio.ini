; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DASYNC_TCP_SSL_ENABLED=0
lib_deps = 
	tzapu/WiFiManager @ ^2.0.17
	knolleary/PubSubClient @ ^2.8
	ESP32Async/ESPAsyncWebServer @ ^3.0.0
	ESP32Async/AsyncTCP @ ^3.0.0
	bblanchon/ArduinoJson @ ^7.0.0

[platformio]
description = Control ceiling fans via RF remote learning and MQTT commands. FanSpitter is a complete ESP32 firmware solution that captures RF signals from ceiling fan remotes, stores them locally, and exposes them over MQTT and a web UI for integration with smart home platforms like OpenHAB.
