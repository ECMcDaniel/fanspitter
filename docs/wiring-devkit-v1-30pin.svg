<circle cx="52" cy="651.5" r="5" fill="#d62828"/>
<text x="66" y="656" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">VCC goes to 3V3 only, never VIN. The CC1101 is a 3.3 V part.</text>
<circle cx="52" cy="673.5" r="5" fill="#0b9aa0"/>
<text x="66" y="678" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">GDO0 goes to D2 (GPIO 2), which also drives the on-board LED. GDO2 stays unconnected.</text>
<circle cx="52" cy="695.5" r="5" fill="#b9bfc7"/>
<text x="66" y="700" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">Line colours are only for tracing. Any jumper colour works.</text>
