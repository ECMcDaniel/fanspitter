; FanSpitter firmware
;
;   pio run                         build
;   pio run -t upload               flash over USB (first install)
;   pio run -e ota -t upload        flash over WiFi (needs FANSPITTER_OTA_PASSWORD)
;   pio test -e native              run host unit tests
;   pio device monitor              serial log

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Versions are pinned so a build today and a build in six months produce the
; same firmware. Bump deliberately and re-test on hardware.
platform  = espressif32 @ 8.0.0
board     = esp32dev
framework = arduino

; Two 1.9 MB OTA app slots (default.csv only leaves 1.25 MB each). The NVS
; partition is at the same offset/size, so learned signals survive a switch.
board_build.partitions = min_spiffs.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

extra_scripts = post:scripts/version.py

build_unflags =
    -DCORE_DEBUG_LEVEL=0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DASYNC_TCP_SSL_ENABLED=0
    -Wall
    ; Pin overrides, e.g. move GDO0 off the GPIO2 strapping pin:
    ; -DPIN_GDO0=4
    ; Remote's carrier in Hz (default 433957000, see src/config.h):
    ; -DRF_FREQ_HZ=303875000

lib_deps =
    tzapu/WiFiManager @ 2.0.17
    knolleary/PubSubClient @ 2.8
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

; Over-the-air update. The device must already run this firmware with an OTA
; password set in the setup portal:
;   FANSPITTER_OTA_PASSWORD=... pio run -e ota -t upload
[env:ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = fanspitter.local
upload_flags    =
    --auth=${sysenv.FANSPITTER_OTA_PASSWORD}

; Host-side unit tests for the pure logic in src/*.h (no hardware needed)
[env:native]
platform       = native
test_framework = unity
test_build_src = no
build_flags    = -std=gnu++17 -Isrc -Wall -Wextra
